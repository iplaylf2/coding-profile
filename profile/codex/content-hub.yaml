# yaml-language-server: $schema=https://raw.githubusercontent.com/iplaylf2/content-hub/master/packages/content-hub/src/contentctl/schema/content-hub.schema.json

origin:
  path: .
  exclude:
    - content-hub.yaml
    - README.md
defaults:
  include:
    - hooks.json
    - hooks/notify.py
    - hooks/requirements.txt
    - hooks/notifications/*.py
  exclude:
    - "**/.*/**"
workspaces:
  codex: ${HOME}/.codex
